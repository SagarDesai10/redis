<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        /* CSS for the chat container and messages */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            max-width: 600px;
            height: 90vh;
            width: 100%;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .chat-header {
            background-color: #4CAF50;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-message {
            padding: 10px;
            border-radius: 5px;
            max-width: 70%;
            word-wrap: break-word;
            font-size: 1rem;
            line-height: 1.5;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chat-message.user {
            align-self: flex-end;
            text-align: right;
            border: 1px solid #d4f8b7;
        }

        .chat-message.friend {
            align-self: flex-start;
            text-align: left;
            border: 1px solid #ddd;
        }

        .chat-name {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #555;
        }

        .chat-input-container {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 10px;
            background-color: #f9f9f9;
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 1rem;
            border-radius: 4px;
        }

        .send-button {
            background-color: #4CAF50;
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 1rem;
            margin-left: 10px;
            border-radius: 4px;
        }

        .send-button:hover {
            background-color: #45a049;
        }
    </style>
    <script>
        // Function to generate consistent colors based on the name
        function generateColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            const color = `hsl(${hash % 360}, 70%, 80%)`;
            return color;
        }

        // Function to render chat messages dynamically
        function renderMessages(messages) {
            const chatMessages = document.querySelector(".chat-messages");
            chatMessages.innerHTML = ""; // Clear existing messages

            messages.forEach(message => {
                const messageDiv = document.createElement("div");
                messageDiv.classList.add("chat-message", message.type);

                const nameDiv = document.createElement("div");
                nameDiv.classList.add("chat-name");
                nameDiv.textContent = message.name;

                const textDiv = document.createElement("div");
                textDiv.textContent = message.text;

                // Set background color based on name
                const bgColor = generateColor(message.name);
                messageDiv.style.backgroundColor = bgColor;

                messageDiv.appendChild(nameDiv);
                messageDiv.appendChild(textDiv);
                chatMessages.appendChild(messageDiv);
            });

            // Scroll to the bottom of the chat messages
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Function to send a message
        function sendMessage() {
            const msgInput = document.getElementById("chat-input");
            const msg = msgInput.value.trim();

            if (!msg) {
                console.error("Message is empty");
                return;
            }

            const xhr = new XMLHttpRequest();
            const url = `http://localhost:8081/app/v1/chatapp/send-msg?message=${encodeURIComponent(msg)}`;

            xhr.open("GET", url, true);

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            const response = JSON.parse(xhr.responseText);
                            renderMessages(response.message);
                            msgInput.value = ""; // Clear input field
                        } catch (error) {
                            console.error("Error parsing JSON response:", error);
                        }
                    } else {
                        console.error(`Error: ${xhr.status} - ${xhr.statusText}`);
                    }
                }
            };

            xhr.onerror = function () {
                console.error("Request failed");
            };

            xhr.send();
        }
    </script>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        Chat App
    </div>

    <div class="chat-messages">
        <!-- Messages will be dynamically rendered here -->
    </div>

    <div class="chat-input-container">
        <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." />
        <button class="send-button" type="button" onclick="sendMessage()">Send</button>
    </div>
</div>
</body>
</html>
